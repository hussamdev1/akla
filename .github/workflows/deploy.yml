name: Deploy Akla to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh real data (OpenStreetMap + your Google Sheet) every 6 hours, even without code changes.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build data (OpenStreetMap + Google Sheet)
        run: node scripts/build-data.mjs
        env:
          # Settings → Secrets and variables → Actions → Variables → AKLA_SHEET_ID (see docs/DATA.md)
          AKLA_SHEET_ID: ${{ vars.AKLA_SHEET_ID }}
          # auto (default) = show demo data only until the sheet has published restaurants · always · never
          AKLA_SHOW_DEMO: ${{ vars.AKLA_SHOW_DEMO }}
      - name: Build static site
        run: npx next build
        env:
          # Served from https://<user>.github.io/<repo>/ — remove if you use a custom domain or a <user>.github.io repo
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Generate service worker
        run: node scripts/build-sw.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
